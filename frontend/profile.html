<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - NutriRoute</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-logo">
                    <i class="fa-solid fa-leaf"></i>
                    <span>NutriRoute<span class="ai-spark"><i class="fa-solid fa-sparkles"></i></span></span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-label">NutriRoute</div>
                <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i> <span>Dashboard</span></a>
                <a href="recommendations.html" class="nav-link"><i class="fa-solid fa-wand-magic-sparkles"></i> <span>AI Food Recommendations</span></a>
                <a href="health.html" class="nav-link"><i class="fa-solid fa-heart-pulse"></i> <span>Health & Nutrition</span></a>
                <a href="meal-planner.html" class="nav-link"><i class="fa-solid fa-calendar-days"></i> <span>Meal Planner</span></a>
                <a href="bmi.html" class="nav-link"><i class="fa-solid fa-scale-balanced"></i> <span>BMI Calculator</span></a>
                <a href="water.html" class="nav-link"><i class="fa-solid fa-droplet"></i> <span>Water Tracker</span></a>
                <a href="fitness.html" class="nav-link"><i class="fa-solid fa-person-running"></i> <span>Fitness Tracker</span></a>
                <a href="favorites.html" class="nav-link"><i class="fa-solid fa-heart"></i> <span>Favorites</span></a>
                <a href="history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i> <span>Recommendation History</span></a>
                <a href="profile.html" class="nav-link active"><i class="fa-solid fa-user"></i> <span>My Profile</span></a>
                <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
            </nav>
        </aside>

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" title="Toggle Navigation"><i class="fa-solid fa-bars"></i></button>
            </div>
            <div class="topbar-right">
                <div class="user-menu">
                    <div class="user-avatar current-user-avatar">US</div>
                </div>
            </div>
        </header>

        <!-- Main Profile View -->
        <main class="main-content">
            <!-- Header Card -->
            <div class="card" style="margin-bottom:2rem; display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap;">
                <div class="user-avatar current-user-avatar" style="width:72px; height:72px; font-size:1.8rem; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800;">US</div>
                <div>
                    <h2 id="user-display-name" style="margin:0 0 0.2rem 0;">User Profile</h2>
                    <p id="user-display-email" class="text-muted" style="margin:0; font-size:0.9rem;">loading...</p>
                </div>
            </div>

            <!-- Profile Form -->
            <div class="card">
                <form id="profile-form">
                    <h3 style="margin-bottom:1.25rem; color:var(--primary); border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">
                        <i class="fa-solid fa-id-card"></i> Account Information
                    </h3>

                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.25rem;">
                        <div class="form-group">
                            <label class="form-label" for="prof-name">Full Name</label>
                            <input type="text" id="prof-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="prof-email">Email Address</label>
                            <input type="email" id="prof-email" class="form-control" disabled style="opacity:0.75;">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="prof-phone">Phone Number</label>
                            <input type="text" id="prof-phone" class="form-control" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>

                    <h3 style="margin:1.75rem 0 1.25rem; color:var(--primary); border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">
                        <i class="fa-solid fa-heart-pulse"></i> Body & Health Preferences
                    </h3>

                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:1.25rem;">
                        <div class="form-group">
                            <label class="form-label" for="prof-age">Age (Years)</label>
                            <input type="number" id="prof-age" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="prof-gender">Gender</label>
                            <select id="prof-gender" class="form-control">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="prof-height">Height (cm)</label>
                            <input type="number" id="prof-height" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="prof-weight">Weight (kg)</label>
                            <input type="number" id="prof-weight" class="form-control">
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.25rem; margin-top:1rem;">
                        <div class="form-group">
                            <label class="form-label" for="prof-activity">Activity Level</label>
                            <select id="prof-activity" class="form-control">
                                <option value="Sedentary">Sedentary</option>
                                <option value="Lightly Active">Lightly Active</option>
                                <option value="Moderately Active">Moderately Active</option>
                                <option value="Very Active">Very Active</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="prof-diet">Dietary Preference</label>
                            <select id="prof-diet" class="form-control">
                                <option value="Vegetarian">Vegetarian</option>
                                <option value="Vegan">Vegan</option>
                                <option value="Non-Vegetarian">Non-Vegetarian</option>
                            </select>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.25rem; margin-top:1rem;">
                        <div class="form-group">
                            <label class="form-label" for="prof-allergies">Allergies (comma-separated)</label>
                            <input type="text" id="prof-allergies" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="prof-conditions">Health Conditions (comma-separated)</label>
                            <input type="text" id="prof-conditions" class="form-control">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top:1.5rem; padding:0.75rem 2rem;">
                        <i class="fa-solid fa-floppy-disk"></i> Update Profile
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
