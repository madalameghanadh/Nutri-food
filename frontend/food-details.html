<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Details - NutriRoute</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-logo">
                    <i class="fa-solid fa-leaf"></i>
                    <span>NutriRoute<span class="ai-spark"><i class="fa-solid fa-sparkles"></i></span></span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-label">NutriRoute</div>
                <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i> <span>Dashboard</span></a>
                <a href="recommendations.html" class="nav-link"><i class="fa-solid fa-wand-magic-sparkles"></i> <span>AI Food Recommendations</span></a>
                <a href="health.html" class="nav-link"><i class="fa-solid fa-heart-pulse"></i> <span>Health & Nutrition</span></a>
                <a href="meal-planner.html" class="nav-link"><i class="fa-solid fa-calendar-days"></i> <span>Meal Planner</span></a>
                <a href="bmi.html" class="nav-link"><i class="fa-solid fa-scale-balanced"></i> <span>BMI Calculator</span></a>
                <a href="water.html" class="nav-link"><i class="fa-solid fa-droplet"></i> <span>Water Tracker</span></a>
                <a href="fitness.html" class="nav-link"><i class="fa-solid fa-person-running"></i> <span>Fitness Tracker</span></a>
                <a href="favorites.html" class="nav-link"><i class="fa-solid fa-heart"></i> <span>Favorites</span></a>
                <a href="history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i> <span>Recommendation History</span></a>
                <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i> <span>My Profile</span></a>
                <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
            </nav>
        </aside>

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" title="Toggle Navigation"><i class="fa-solid fa-bars"></i></button>
                <a href="recommendations.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Recommendations</a>
            </div>
            <div class="topbar-right">
                <div class="user-menu" onclick="window.location.href='profile.html'">
                    <div class="user-avatar current-user-avatar">US</div>
                </div>
            </div>
        </header>

        <!-- Main Food Details View -->
        <main class="main-content">
            <div id="food-detail-container">
                <div style="text-align:center; padding:4rem;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size:2.5rem; color:var(--primary); margin-bottom:1rem;"></i>
                    <p>Loading food details...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authenticated = await AuthService.checkAuth();
            if (!authenticated) return;

            const params = new URLSearchParams(window.location.search);
            const foodId = params.get('id');

            if (!foodId) {
                document.getElementById('food-detail-container').innerHTML = `
                    <div class="card text-center" style="padding:3rem;">
                        <h3>Food item not specified.</h3>
                        <a href="recommendations.html" class="btn btn-primary" style="margin-top:1rem;">Back to Recommendations</a>
                    </div>
                `;
                return;
            }

            const res = await NutriCommon.apiFetch(`/foods/${foodId}`);

            if (res.success && res.food) {
                const food = res.food;
                currentFoodItem = food;
                renderFoodDetails(food);
            } else {
                document.getElementById('food-detail-container').innerHTML = `
                    <div class="card text-center" style="padding:3rem;">
                        <h3>Food Item Not Found</h3>
                        <p>${res.message || ''}</p>
                        <a href="recommendations.html" class="btn btn-primary" style="margin-top:1rem;">Back to Recommendations</a>
                    </div>
                `;
            }
        });

        function renderFoodDetails(food) {
            const container = document.getElementById('food-detail-container');
            container.innerHTML = `
                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:2rem;">
                    <div>
                        <img src="${food.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'}" alt="${food.name}" style="width:100%; max-height:400px; object-fit:cover; border-radius:16px; box-shadow:var(--shadow-md);">
                    </div>

                    <div style="display:flex; flex-direction:column; gap:1.25rem;">
                        <div>
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.5rem;">
                                <span class="badge badge-secondary" style="text-transform:uppercase;">${food.category}</span>
                                <span style="font-size:1.8rem; font-weight:800; color:var(--primary);">₹${food.price || 150}</span>
                            </div>
                            <h1 style="font-size:2.2rem; font-weight:800; margin-bottom:0.5rem;">${food.name}</h1>
                            <p class="text-muted" style="font-size:1rem;">${food.description || ''}</p>
                        </div>

                        <div class="card" style="padding:1rem; background:var(--bg-card);">
                            <h4 style="margin-bottom:0.75rem; color:var(--primary);"><i class="fa-solid fa-chart-pie"></i> Nutritional Breakdown (${food.serving_size || '1 serving'})</h4>
                            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(90px, 1fr)); gap:0.75rem; text-align:center;">
                                <div style="background:var(--bg-input, #f3f4f6); padding:0.75rem; border-radius:8px;">
                                    <span style="font-size:1.3rem; font-weight:800; color:var(--primary);">${food.calories}</span>
                                    <span style="display:block; font-size:0.75rem; color:var(--text-muted);">Calories (kcal)</span>
                                </div>
                                <div style="background:var(--bg-input, #f3f4f6); padding:0.75rem; border-radius:8px;">
                                    <span style="font-size:1.3rem; font-weight:800; color:#10b981;">${food.protein}g</span>
                                    <span style="display:block; font-size:0.75rem; color:var(--text-muted);">Protein</span>
                                </div>
                                <div style="background:var(--bg-input, #f3f4f6); padding:0.75rem; border-radius:8px;">
                                    <span style="font-size:1.3rem; font-weight:800; color:#0ea5e9;">${food.carbohydrates || food.carbs || 0}g</span>
                                    <span style="display:block; font-size:0.75rem; color:var(--text-muted);">Carbs</span>
                                </div>
                                <div style="background:var(--bg-input, #f3f4f6); padding:0.75rem; border-radius:8px;">
                                    <span style="font-size:1.3rem; font-weight:800; color:#f59e0b;">${food.fat}g</span>
                                    <span style="display:block; font-size:0.75rem; color:var(--text-muted);">Fat</span>
                                </div>
                                <div style="background:var(--bg-input, #f3f4f6); padding:0.75rem; border-radius:8px;">
                                    <span style="font-size:1.3rem; font-weight:800; color:#8b5cf6;">${food.fiber || 0}g</span>
                                    <span style="display:block; font-size:0.75rem; color:var(--text-muted);">Fiber</span>
                                </div>
                            </div>
                        </div>

                        ${Array.isArray(food.health_benefits) && food.health_benefits.length > 0 ? `
                            <div class="card" style="padding:1rem;">
                                <h4 style="margin-bottom:0.5rem; color:var(--primary);"><i class="fa-solid fa-heart-pulse"></i> Health Benefits</h4>
                                <ul style="margin:0; padding-left:1.25rem; font-size:0.9rem; color:var(--text-main);">
                                    ${food.health_benefits.map(b => `<li>${b}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}

                        <div style="display:flex; gap:0.75rem; margin-top:0.5rem; flex-wrap:wrap;">
                            <button onclick="CartService.addItem(currentFoodItem, 1)" class="btn btn-primary" style="flex:2; padding:0.85rem; font-size:1rem;">
                                <i class="fa-solid fa-cart-plus"></i> Add to Cart • ₹${food.price || 150}
                            </button>
                            <button id="add-fav-btn" onclick="addFoodFavorite('${food.id}')" class="btn btn-outline" style="flex:1;">
                                <i class="fa-solid fa-heart"></i> Favorite
                            </button>
                            <a href="cart.html" class="btn btn-secondary">
                                <i class="fa-solid fa-bag-shopping"></i> View Cart
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        let currentFoodItem = null;

        async function addFoodFavorite(foodId) {
            const btn = document.getElementById('add-fav-btn');
            NutriCommon.setLoading(btn, true, 'Adding...');
            const res = await NutriCommon.apiFetch(`/favorites/${foodId}`, { method: 'POST' });
            NutriCommon.setLoading(btn, false);

            if (res.success) {
                NutriCommon.showToast(res.message || 'Added to favorites!', 'success');
            } else {
                NutriCommon.showToast(res.message || 'Failed to add favorite.', 'danger');
            }
        }
    </script>
</body>
</html>
