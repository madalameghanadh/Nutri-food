<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NutriRoute</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, rgba(16,185,129,0.06) 0%, rgba(14,165,233,0.06) 100%); padding:1.5rem;">

    <div style="width:100%; max-width:440px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:2.5rem; box-shadow:var(--shadow-lg);">
        <div style="text-align:center; margin-bottom:2rem;">
            <a href="login.html" class="brand-logo" style="justify-content:center; margin-bottom:0.75rem;">
                <i class="fa-solid fa-leaf"></i>
                <span>NutriRoute<span class="ai-spark"><i class="fa-solid fa-sparkles"></i></span></span>
            </a>
            <h2>Welcome Back</h2>
            <p class="text-muted" style="font-size:0.875rem;">Log in to access your personalized health dashboard.</p>
        </div>

        <div id="login-alert" style="display:none; margin-bottom:1.25rem; width:100%; text-align:center; padding:0.75rem;" class="badge badge-danger"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                    <label class="form-label" for="login-password" style="margin:0;">Password</label>
                </div>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width:100%; padding:0.75rem; margin-top:0.5rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border-color); text-align:center;">
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.75rem;">Don't have an account?</p>
            <a href="register.html" class="btn btn-outline" style="width:100%;">Create Free Account</a>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('login-submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                NutriCommon.setLoading(submitBtn, true, 'Verifying credentials...');

                const result = await AuthService.login(email, password);

                NutriCommon.setLoading(submitBtn, false);

                if (result.success) {
                    NutriCommon.showToast('Login successful!', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    alertBox.textContent = result.message || 'Invalid email or password.';
                    alertBox.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
